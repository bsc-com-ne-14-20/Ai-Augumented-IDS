<div id="upload-section">
    <div class="upload-zone" id="drop-zone">
        <div class="upload-content">
            <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p>Drag your HTTP log CSV here or <span class="browse-link" id="browse-btn">click to browse</span></p>
            <input type="file" id="file-input" accept=".csv" style="display: none;">
            <p id="file-name-display" class="file-name"></p>
        </div>
        
        <div id="upload-progress-container" style="display: none;">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="upload-progress-bar"></div>
            </div>
        </div>
        <div id="upload-error" class="upload-error" style="display: none;"></div>
    </div>
    <div class="upload-actions" style="display: none;" id="upload-actions">
        <button class="btn btn-primary" id="btn-upload-another">Upload another</button>
    </div>
</div>
