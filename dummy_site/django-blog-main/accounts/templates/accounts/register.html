{% extends "feature/base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-6 col-lg-4">
    <article class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center">Create an Account</h2>

        <form method="post" action="{% url 'auth-register' %}" novalidate>
          {% csrf_token %}

          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                {{ field.label }}
              </label>
              {{ field }}
            </div>
          {% endfor %}

          <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-primary fw-semibold py-2">
              Register
            </button>
          </div>

          <p class="text-center mt-3 mb-0">
            <small class="text-muted">
              Already have an account?
              <a href="{% url 'auth-login' %}" class="text-decoration-none">Login</a>
            </small>
          </p>
        </form>
      </div>
    </article>
  </div>
</div>

<script>
  document.querySelectorAll('input').forEach(input => {
    input.classList.add('form-control');
  });
</script>
{% endblock %}
