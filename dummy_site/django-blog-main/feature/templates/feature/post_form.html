{% extends "feature/base.html" %}

{% block title %}Blog Post{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-8 col-lg-6">
    <article class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h2 class="card-title mb-4 text-center">Blog Post</h2>

        <form method="post" novalidate>
            {% csrf_token %}

            {% if form.non_field_errors %}
              <div class="alert alert-danger mb-3">
                {{ form.non_field_errors }}
              </div>
            {% endif %}

            <div class="mb-3">
              <label for="{{ form.title.id_for_label }}" class="form-label">Title</label>
              {{ form.title }}
            </div>

            <div class="mb-3">
              <label for="{{ form.content.id_for_label }}" class="form-label">Content</label>
              {{ form.content }}
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
              <button type="submit" class="btn btn-primary">
                {% if form.instance.pk %}Update{% else %}Post{% endif %}
              </button>
              <a href="{% url 'feature-home' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
          </form>
      </div>
    </article>
  </div>
</div>

<script>
  document.querySelectorAll('input[type="text"], textarea').forEach(input => {
    input.classList.add('form-control');
  });
</script>
{% endblock %}
