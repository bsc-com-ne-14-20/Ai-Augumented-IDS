{% extends "feature/base.html" %}

{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-6 col-lg-4">
    <article class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4">
        <h2 class="card-title mb-3 text-center">Delete Post</h2>
        
        <div class="alert alert-warning mb-4" role="alert">
          <p class="mb-0">
            Are you sure you want to delete <strong>"{{ post.title }}"</strong>? This action cannot be undone.
          </p>
        </div>

        <form method="post" action="{% url 'feature-post-delete' post.id %}">
          {% csrf_token %}

          <div class="d-flex justify-content-between align-items-center">
            <button type="submit" class="btn btn-danger">
              Delete
            </button>
            <a href="{% url 'feature-post-detail' post.id %}" class="btn btn-outline-secondary">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </article>
  </div>
</div>
{% endblock %}
